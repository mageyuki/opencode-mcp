name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install npm 12.0.1 (runner only)
        run: npm install --global npm@12.0.1
      - name: Verify exact toolchain
        run: |
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "12.0.1"
      - run: npm ci
      - run: npm test
      - name: Coverage gate
        run: npm run test:coverage
      - name: Dependency vulnerability gate
        run: npm audit
      - run: npm run docs:check
      - run: npm run test:package
      - run: npm run test:compat
      - run: git diff --check
