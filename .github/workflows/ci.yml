name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install npm 12 series (runner only)
        run: npm install --global npm@12
      - name: Verify toolchain major versions
        run: |
          node --version
          npm --version
          test "$(node --version | cut -d. -f1)" = "v24"
          test "$(npm --version | cut -d. -f1)" = "12"
      - run: npm ci
      - run: npm test
      - name: Coverage gate
        run: npm run test:coverage
      - name: Dependency vulnerability gate
        run: npm audit
      - run: npm run docs:check
      - run: npm run test:package
      - run: npm run test:compat
      - run: git diff --check
